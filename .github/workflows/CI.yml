name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
          - host: windows-latest
            target: i686-pc-windows-msvc
          # Linux builds run in containers so the resulting .node works
          # against an older glibc / musl than the runners themselves ship.
          # The napi-rs images carry the cross toolchains but pin Cargo 1.82,
          # which predates edition2024 and cannot read oxc's dependency tree,
          # so the toolchain is updated first. Their Alpine image is stuck on
          # Node 18, which lacks util.styleText that @napi-rs/cli needs, so
          # musl uses the official Node image and installs Rust from Alpine.
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian
            prep: rustup update stable --no-self-update && rustup default stable
          # An amd64 image that cross-compiles to aarch64, so it belongs on an
          # x64 runner.
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian-aarch64
            prep: rustup update stable --no-self-update && rustup default stable
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            docker: node:22-alpine
            prep: apk add --no-cache rustup build-base && rustup-init -y --profile minimal --default-toolchain stable && export PATH=$HOME/.cargo/bin:$PATH
          # node:22-alpine is multi-arch, so this one builds natively. The
          # napi CLI still asks for the cross-compiler name even when host and
          # target agree, and Alpine's gcc is already a musl gcc, so point that
          # name at it rather than fighting over the linker env var the CLI
          # sets for itself.
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            docker: node:22-alpine
            prep: apk add --no-cache rustup build-base && rustup-init -y --profile minimal --default-toolchain stable && export PATH=$HOME/.cargo/bin:$PATH && ln -sf /usr/bin/gcc /usr/local/bin/aarch64-linux-musl-gcc
          - host: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            setup: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
            linker: CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        if: ${{ !matrix.settings.docker }}
        with:
          node-version: 22

      - name: Install Rust
        if: ${{ !matrix.settings.docker }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.settings.docker }}
        with:
          key: ${{ matrix.settings.target }}

      - name: Platform setup
        if: ${{ matrix.settings.setup }}
        run: ${{ matrix.settings.setup }}
        shell: bash

      - name: Install dependencies
        if: ${{ !matrix.settings.docker }}
        run: npm install --ignore-scripts

      - name: Build in container
        if: ${{ matrix.settings.docker }}
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ matrix.settings.docker }}
          options: "--user 0:0 -v ${{ github.workspace }}:/build -w /build"
          run: |
            set -e
            ${{ matrix.settings.prep }}
            rustup target add ${{ matrix.settings.target }}
            npm install --ignore-scripts
            npx napi build --platform --release --target ${{ matrix.settings.target }}

      - name: Build
        if: ${{ !matrix.settings.docker }}
        run: ${{ matrix.settings.linker }} npx napi build --platform --release --target ${{ matrix.settings.target }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: "*.node"
          if-no-files-found: error

  test:
    name: Test on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Download the binary for this host
        uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: .
      - run: npm test

  publish:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets npm record provenance for the published package.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - run: npm install --ignore-scripts

      - name: Download all bindings
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Refuse to publish a tag that disagrees with package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Move each binary into its platform package
        run: npx napi artifacts --npm-dir npm --build-output-dir artifacts

      - name: Publish
        run: |
          npx napi prepublish -t npm --npm-dir npm
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            npm publish --access public
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
