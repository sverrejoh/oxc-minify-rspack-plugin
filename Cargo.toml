[package]
name    = "oxc-minify-rspack-plugin"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi        = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
oxc         = { version = "0.130", features = ["codegen", "minifier"] }
sourcemap     = "9"
oxc_sourcemap = "6"

[build-dependencies]
napi-build = "2"

[profile.release]
lto       = true
opt-level = 3
strip     = "symbols"
